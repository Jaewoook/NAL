general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/DATABASE_URL"
  disable_env_credential_login: true
  disable_password_login_when_sso_enabled: true
  auto_redirect_ui_login_to_sso: true

router_settings:
  enable_pre_call_checks: true

litellm_settings:
  telemetry: false
  drop_params: true
  modify_params: true
  callbacks:
    - "websearch_interception"
  websearch_interception_params:
    search_tool_name: "websearch-searxng"
    enabled_providers:
      - "anthropic"
      - "openai"

  allowed_openai_params:
    - "reasoning_effort"
    - "thinking"
    - "output_config"
    - "extra_body"
    - "chat_template_kwargs"
  public_model_groups:
    - "qwen3.8-27b-oq6e-mtp"
    - "qwen3.8-27b-oq6e-mtp-nothink"
    - "gemma4-31b-it-oq6e-mtp"
    - "gemma4-31b-it-oq6e-mtp-nothink"
    - "claude-sonnet-5-qwe-n-3.8-27b-oq6e-mtp"
    - "claude-sonnet-5-qwe-n-3.8-27b-oq6e-mtp-nothink"
    - "claude-sonnet-5-gemm-a-4-31b-it-oq6e-mtp"
    - "claude-sonnet-5-gemm-a-4-31b-it-oq6e-mtp-nothink"

search_tools:
  - search_tool_name: "websearch-searxng"
    litellm_params:
      search_provider: "searxng"
      api_base: "http://searxng:8080"

model_list:
  # =================================================================
  # 1. OpenAI Compatible Endpoints (ATLAS_OPEN_API_BASE)
  # =================================================================
  - model_name: "qwen3.8-27b-oq6e-mtp"
    litellm_params:
      model: "openai/Qwen3.8-27B-oQ6e-mtp"
      api_base: "os.environ/ATLAS_OPEN_API_BASE"
      api_key: "omlx-local"
      # Set based on Gemini 3.8 Flash pricing (In: $0.75 / Out: $3.75 per 1M token)
      input_cost_per_token: 0.00000075
      output_cost_per_token: 0.00000375
    model_info:
      mode: "chat"
      supports_reasoning: true
      supports_function_calling: true

  - model_name: "qwen3.8-27b-oq6e-mtp-nothink"
    litellm_params:
      model: "openai/Qwen3.8-27B-oQ6e-mtp"
      api_base: "os.environ/ATLAS_OPEN_API_BASE"
      api_key: "omlx-local"
      temperature: 0.7
      top_p: 0.80
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
      # Set based on Gemini 3.8 Flash pricing (In: $0.75 / Out: $3.75 per 1M token)
