general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/DATABASE_URL"
  disable_env_credential_login: true
  disable_password_login_when_sso_enabled: true
  auto_redirect_ui_login_to_sso: true

router_settings:
  enable_pre_call_checks: true

litellm_settings:
  telemetry: false
  drop_params: true
  modify_params: true
  public_model_groups:
    - "Qwen3.8-27B-oQ6e-mtp"
    - "claude-qwe-n-3.8-27b-oq6e-mtp"
    - "claude-gemm-a-4-31b-it-oq6e-mtp"

model_list:
  - model_name: "Qwen3.8-27B-oQ6e-mtp"
    litellm_params:
      model: "openai/Qwen3.8-27B-oQ6e-mtp"
      api_base: "os.environ/ATLAS_OPEN_API_BASE"
      api_key: "omlx-local"
      # Set based on Gemini 3.8 Flash pricing (In: $0.75 / Out: $3.75 per 1M token)
      input_cost_per_token: 0.00000075
      output_cost_per_token: 0.00000375

  - model_name: "claude-qwe-n-3.8-27b-oq6e-mtp"
    litellm_params:
      model: "anthropic/Qwen3.8-27B-oQ6e-mtp"
      api_base: "os.environ/ATLAS_ANTHROPIC_API_BASE"
      api_key: "omlx-local"
      # Set based on Gemini 3.8 Flash pricing (In: $0.75 / Out: $3.75 per 1M token)
      input_cost_per_token: 0.00000075
      output_cost_per_token: 0.00000375

  - model_name: "claude-gemm-a-4-31b-it-oq6e-mtp"
    litellm_params:
      model: "anthropic/gemma-4-31B-it-oQ6e-mtp"
      api_base: "os.environ/ATLAS_ANTHROPIC_API_BASE"
      api_key: "omlx-local"
      # Set based on Gemini 3.8 Flash pricing (In: $0.75 / Out: $3.75 per 1M token)
      input_cost_per_token: 0.00000075
      output_cost_per_token: 0.00000375

  - model_name: "*"
    litellm_params:
      model: "openai/Qwen3.8-27B-oQ6e-mtp"
      api_base: "os.environ/ATLAS_OPEN_API_BASE"
      api_key: "omlx-local"
      # Set based on Gemini 3.8 Flash pricing (In: $0.75 / Out: $3.75 per 1M token)
      input_cost_per_token: 0.00000075
      output_cost_per_token: 0.00000375
