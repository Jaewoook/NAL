services:
  homebrew-nal-web:
    image: homebrew-nal-web:latest
    container_name: homebrew-nal-web
    restart: unless-stopped
    expose:
      - "${PORT}"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    networks:
      - default
      - db_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:10245/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  default:
    external: true
    name: nginx_network
  db_network:
    external: true
