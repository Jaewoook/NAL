tunnel: 20c13794-8e52-42ad-a48c-926a1c2b1e83

originRequest:
  noTLSVerify: true
  originServerName: auth.jaewook.dev

ingress:
  # All *.jaewook.dev services served via Nginx Proxy Manager
  - hostname: "*.jaewook.dev"
    service: https://nginx-proxy:443

  # For SSH Access
  - hostname: axis.jaewook.me
    service: ssh://host.docker.internal:22

  - service: http_status:404

loglevel: info
