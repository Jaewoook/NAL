services:
  postgresql:
    image: docker.io/library/postgres:16-alpine
    container_name: postgresql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${PG_DB:-postgres}
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASS:?database password required}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    expose:
      - 5432
    volumes:
      - database:/var/lib/postgresql/data
      # Provisioning scripts for additional per-service databases/roles.
      # Only run by postgres on first init (empty `database` volume).
      - ./init:/docker-entrypoint-initdb.d:ro

volumes:
  database:
    external: true
    name: nal_main_db

networks:
  default:
    external: true
    name: db_network
