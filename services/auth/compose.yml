services:
  server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.5.3}
    container_name: authentik-server
    command: server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?database password required}
    shm_size: 512mb
    expose:
      - 9000
      - 9443
    networks:
      - default
      - db_network
    volumes:
      - data:/data
      - templates:/templates
      # Git-managed sign-in background. In authentik: System > Brands > edit
      # brand > "Default flow background" > enter `branding/bg_signin.jpg`
      # (relative path, no leading slash).
      - ./assets/images/bg_signin.jpg:/data/media/public/branding/bg_signin.jpg:ro

  worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.5.3}
    container_name: authentik-worker
    command: worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?secret key required}
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__NAME: ${PG_DB:-authentik}
      AUTHENTIK_POSTGRESQL__USER: ${PG_USER:-authentik}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?database password required}
    # Required by authentik's embedded outpost to manage docker-based outposts.
    user: root
    shm_size: 512mb
    networks:
      - default
      - db_network
    volumes:
      - data:/data
      - certs:/certs
      - templates:/templates
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  data:
  certs:
  templates:

networks:
  default:
    external: true
    name: nginx_network
  db_network:
    external: true
