volumes:
  portainer_data:

services:
  portainer:
    image: portainer/portainer-ee:2.43.0-linux-arm64-alpine
    container_name: portainer
    expose:
      - 8000
      - 9443
    networks:
      default:
        ipv4_address: 172.22.0.5
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

networks:
  default:
    external: true
    name: nginx_network
