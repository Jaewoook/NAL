name: Repo Syntax Check

on:
  push:
    branches: [main]
    paths:
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.sh'
      - 'manage-service'
      - '.github/workflows/repo-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - '**/*.yml'
      - '**/*.yaml'
      - '**/*.sh'
      - 'manage-service'
      - '.github/workflows/repo-lint.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  yaml:
    name: YAML Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate YAML syntax and duplicate keys
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import subprocess
          import sys
          import yaml

          class StrictLoader(yaml.SafeLoader):
              pass

          def construct_mapping(loader, node, deep=False):
              keys = set()
              for key_node, _ in node.value:
                  key = loader.construct_object(key_node, deep=deep)
                  if key in keys:
                      raise yaml.constructor.ConstructorError(
                          "while constructing a mapping",
                          node.start_mark,
                          f"found duplicate key {key!r}",
                          key_node.start_mark,
                      )
                  keys.add(key)
              return yaml.SafeLoader.construct_mapping(loader, node, deep=deep)

          StrictLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG,
              construct_mapping,
          )

          files = subprocess.check_output(
              ["git", "ls-files", "*.yml", "*.yaml"],
              text=True,
          ).splitlines()

          errors = 0
          for path in files:
              try:
                  with open(path, "r", encoding="utf-8") as fh:
                      list(yaml.load_all(fh, Loader=StrictLoader))
              except Exception as exc:
                  print(f"::error file={path}::YAML syntax error: {exc}")
                  errors += 1

          print(f"Checked {len(files)} YAML file(s), {errors} error(s).")
          sys.exit(1 if errors else 0)
          PY

  shell:
    name: Shell Script Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check shell script syntax (sh -n / bash -n) and ShellCheck errors
        run: |
          set -euo pipefail

          mapfile -t scripts < <(
            {
              git ls-files '*.sh'
              while IFS= read -r f; do
                if head -n 1 "$f" 2>/dev/null | grep -qE '^#!.*\b(ba|da|k|z)?sh\b'; then
                  echo "$f"
                fi
              done < <(git ls-files)
            } | sort -u
          )

          echo "Checking ${#scripts[@]} shell script(s)..."
          errors=0
          for f in "${scripts[@]}"; do
            shebang=$(head -n 1 "$f" 2>/dev/null || true)
            if echo "$shebang" | grep -q "bash"; then
              if ! bash -n "$f"; then
                echo "::error file=${f}::bash syntax error"
                errors=$((errors + 1))
              fi
            else
              if ! sh -n "$f"; then
                echo "::error file=${f}::sh syntax error"
                errors=$((errors + 1))
              fi
            fi
          done

          if [ "$errors" -ne 0 ]; then
            echo "Found ${errors} shell syntax error(s)."
            exit 1
          fi

          shellcheck --severity=error "${scripts[@]}"
          echo "All ${#scripts[@]} shell script(s) passed syntax checks."
