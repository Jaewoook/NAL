# ==============================================================================
# NAL Security Hub - Agent Configuration Example (config.agent.yml)
# ==============================================================================
# Copy to config.agent.yml on each remote LAN Agent host.
# Agents connect outbound to the central Hub via HTTP long-polling (no listening port required).

# Leave node_name empty to auto-detect from system hostname, or set an explicit name
node_name: ""
agent_token: "replace-with-shared-lan-agent-secret"

# Central Security Hub URL for outbound registration, heartbeats, and reverse-poll commands
hub_url: "http://192.168.0.2:10311"

database:
  data_dir: "data"

scanner:
  eol_warning_days: 30
  services_dir: "../../services"
  daemons_dir: ".."

updater:
  batch_dir: "../../batch"
  deadman_timeout_seconds: 60
