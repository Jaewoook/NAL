# ==============================================================================
# NAL Security Hub - Agent Configuration Example (config.agent.yml)
# ==============================================================================
# Copy to config.agent.yml on each remote LAN Agent host.

# Leave node_name empty to auto-detect from system hostname, or set an explicit name
node_name: ""
agent_token: "replace-with-shared-lan-agent-secret"

# Central Security Hub URL for automatic background registration & heartbeats
hub_url: "http://axis:10311"

# Explicit agent URL reachable by the central Hub (e.g. http://192.168.0.4:10247).
# Leave empty to auto-detect the outbound LAN IP toward hub_url on every heartbeat.
agent_advertise_url: ""

web:
  host: "0.0.0.0"
  port: 10247

database:
  data_dir: "data"

scanner:
  eol_warning_days: 30
  services_dir: "../../services"
  daemons_dir: ".."

updater:
  batch_dir: "../../batch"
  deadman_timeout_seconds: 60
