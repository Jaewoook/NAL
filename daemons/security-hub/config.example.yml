# ==============================================================================
# NAL Security Hub - Configuration Example
# ==============================================================================

# Leave node_name empty to auto-detect from system hostname, or set an explicit name
node_name: ""
agent_token: "replace-with-shared-lan-agent-secret"

web:
  host: "0.0.0.0"
  port: 10311
  public_url: "https://securityhub.jaewook.dev"

auth:
  oidc_issuer: "https://auth.jaewook.dev/application/o/nal-security-hub/"
  oidc_client_id: "nal-security-hub"
  oidc_client_secret: ""
  redirect_url: "https://securityhub.jaewook.dev/api/auth/oidc/callback"
  session_secret: "replace-with-openssl-rand-hex-32"
  session_ttl_hours: 24
  rp_id: "securityhub.jaewook.dev"

database:
  container_name: "postgresql"
  db_name: "security_hub_db"
  db_user: "security_hub"
  db_pass: "security_hub_pass"
  data_dir: "data"

scanner:
  interval_hours: 6
  eol_warning_days: 30
  services_dir: "../../services"
  daemons_dir: ".."

updater:
  batch_dir: "../../batch"
  deadman_timeout_seconds: 60
  critical_services:
    - "cloudflare-tunnel"
    - "nginx-proxy"
    - "auth"
    - "db"
    - "dns"
  stateful_volumes:
    db: "nal_main_db"
    dns: "nal_dns_config"
    iot: "nal_ha_config"
    nginx-proxy: "nginx_proxy_data"
  git:
    enabled: true
    bot_name: "NAL Bot"
    bot_email: "nal-git-system@jaewook.me"
    gpg_sign: true
    gpg_key: "024D4017DFF5360A"

notifications:
  email:
    enabled: false
    smtp_host: "smtp.gmail.com"
    smtp_port: 587
    use_tls: true
    username: ""
    password: ""
    from_email: ""
    to_email: ""
